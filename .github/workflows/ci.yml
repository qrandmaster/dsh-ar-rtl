name: التحقق الآلي

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: فحص المستودع
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: مطابقة القواميس
        run: node tools/validate-ar.mjs --strict

      - name: إعادة بناء الحزمة من المصدر
        run: node tools/build-client.mjs

      - name: الحزمة الملتزَمة يجب أن تطابق المصادر
        run: git diff --exit-code -- client.js

      - name: الاختبار الذاتي للحزمة
        run: node tools/selftest.mjs

      - name: توازن أقواس الورقة الاتجاهية
        run: |
          node -e "
          const css = require('fs').readFileSync('src/rtl.css', 'utf8');
          const open = (css.match(/{/g) || []).length;
          const close = (css.match(/}/g) || []).length;
          if (open !== close) { console.error('أقواس غير متوازنة:', open, close); process.exit(1); }
          console.log('أقواس متوازنة:', open);
          "
