name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dictionary parity
        run: node tools/validate-ar.mjs --strict

      - name: Rebuild the bundle from source
        run: node tools/build-client.mjs

      - name: The committed bundle must match the sources
        run: git diff --exit-code -- client.js

      - name: Runtime self-test
        run: node tools/selftest.mjs

      - name: The stylesheet must be parse-balanced
        run: |
          node -e "
          const css = require('fs').readFileSync('src/rtl.css', 'utf8');
          const open = (css.match(/{/g) || []).length;
          const close = (css.match(/}/g) || []).length;
          if (open !== close) { console.error('unbalanced braces:', open, close); process.exit(1); }
          console.log('balanced braces:', open);
          "
